<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goal Overlay · Control</title>
<link rel="icon" href="data:,">
<script type="module" src="./js/storage.js"></script>
<script type="module" src="./js/dashboard.js"></script>
<link rel="stylesheet" href="./css/dashboard.css">
</head>
<body>
<div class="wrap">
  <div class="col-left">
    <div>
      <h1>Goal Overlay</h1>
      <div class="status"><span class="dot" id="dot-ov"></span><span id="status-ov">No channel</span></div>
      <div class="msg" id="msg" hidden></div>
    </div>

    <div class="panel">
      <h2>Channel</h2>
      <label class="field">Twitch channel name
        <input id="channel" spellcheck="false" placeholder="yourchannel">
      </label>
      <div class="keybar">
        <span>Secret key: <em class="none" id="key-none">not generated</em><code id="key-val" hidden></code></span>
        <button type="button" id="btn-copy-url" disabled>Copy overlay URL</button>
        <button type="button" id="btn-key">Generate key</button>
      </div>
      <p class="note">Paste the overlay URL into OBS as a Browser Source. Only someone with the key can control this overlay.</p>
    </div>

    <div class="panel">
      <h2>Goal settings</h2>
      <label class="field">Caption text
        <input id="goal-label" type="text" value="Meta Partner Plus 2">
      </label>
      <label class="field">Style palette
        <select id="goal-style">
          <option value="grape">Grape</option>
          <option value="default">Default</option>
          <option value="sapphire">Sapphire</option>
          <option value="ocean">Ocean</option>
          <option value="emerald">Emerald</option>
          <option value="green">Green</option>
          <option value="orange">Orange</option>
          <option value="yellow">Yellow</option>
          <option value="red">Red</option>
          <option value="cherry">Cherry</option>
          <option value="chocolate">Chocolate</option>
          <option value="snow">Snow</option>
          <option value="carbon">Carbon</option>
          <option value="chalk">Chalk</option>
        </select>
      </label>
      <label class="field">Overlay width (px)
        <input id="overlay-width" type="number" min="200" max="1920" step="10" value="600">
      </label>
      <label class="field">Target (points)
        <input id="goal-target" type="number" min="1" step="1" value="200">
      </label>
      <label class="field">Points — Tier 1
        <input id="sub-tier1" type="number" min="0" step="1" value="1">
      </label>
      <label class="field">Points — Tier 2
        <input id="sub-tier2" type="number" min="0" step="1" value="2">
      </label>
      <label class="field">Points — Tier 3
        <input id="sub-tier3" type="number" min="0" step="1" value="6">
      </label>
      <div class="row seg">
        <label class="field"><input id="hide-gifted-overlay" type="checkbox"> Hide gifted subs in overlay</label>
        <label class="field"><input id="hide-prime-overlay" type="checkbox"> Hide Prime subs in overlay</label>
        <label class="field"><input id="hide-community-overlay" type="checkbox"> Hide community gifts in overlay</label>
      </div>
      <div class="row seg">
        <label class="field"><input id="events-fade" type="checkbox"> Fade out events</label>
        <label class="field">Fade after (ms)
          <input id="events-fade-ms" type="number" min="1000" step="500" value="10000">
        </label>
      </div>
      <button type="button" id="btn-save">Save settings</button>
    </div>
  </div>

  <div class="col-right">
    <div class="panel panel-preview">
      <h2>Preview</h2>
      <div id="preview-shell"><iframe id="preview" title="Goal overlay preview" hidden></iframe></div>
      <p class="note" id="preview-note">Generate a key to preview the overlay that goes into OBS.</p>
    </div>

    <div class="panel panel-test">
      <h2>Test events</h2>
      <label class="field">Username
        <input id="test-username" type="text" placeholder="Viewer" value="TestUser">
      </label>
      <div class="test-row">
        <button type="button" id="btn-test-tier1">Tier 1 sub</button>
        <button type="button" id="btn-test-tier2">Tier 2 sub</button>
        <button type="button" id="btn-test-tier3">Tier 3 sub</button>
      </div>
      <div class="test-row">
        <button type="button" id="btn-test-gift1">Gifted Tier 1</button>
        <button type="button" id="btn-test-gift2">Gifted Tier 2</button>
      </div>
      <button type="button" id="btn-test-reset">Reset points</button>
    </div>
  </div>
</div>
</body>
</html>
