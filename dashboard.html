<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goal Overlay · Control</title>
<link rel="icon" href="data:,">
<script type="module" src="./js/storage.js"></script>
<script type="module" src="./js/dashboard.js"></script>
<link rel="stylesheet" href="./css/dashboard.css">
</head>
<body>
<div class="wrap">
  <div class="col-left">
    <div>
      <h1>Goal Overlay</h1>
      <div class="status"><span class="dot" id="dot-ov"></span><span id="status-ov">No channel</span></div>
      <div class="msg" id="msg" hidden></div>
    </div>

    <div id="connection-panel" class="panel">
      <h2 id="connection-title">Connect Twitch</h2>
      <button type="button" id="btn-connect">Connect Twitch account</button>
      <div id="connection-connected" hidden style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);">
        <span id="connection-status">Connected</span>
        <button type="button" id="btn-copy-url" disabled>Copy overlay URL</button>
      </div>
    </div>

    <div id="goals-section" hidden class="panel">
      <h2>Active goals</h2>
      <div id="goals-list"></div>
    </div>

    <div id="settings-section" hidden class="panel">
      <h2>Goal settings</h2>
      <label class="field">Caption override (blank = use goal description from Twitch)
        <input id="goal-label" type="text" placeholder="e.g. Road to Partner Plus">
      </label>
      <label class="field">Style palette
        <select id="goal-style">
          <option value="grape">Grape</option>
          <option value="default">Default</option>
          <option value="sapphire">Sapphire</option>
          <option value="ocean">Ocean</option>
          <option value="emerald">Emerald</option>
          <option value="green">Green</option>
          <option value="orange">Orange</option>
          <option value="yellow">Yellow</option>
          <option value="red">Red</option>
          <option value="cherry">Cherry</option>
          <option value="chocolate">Chocolate</option>
          <option value="snow">Snow</option>
          <option value="carbon">Carbon</option>
          <option value="chalk">Chalk</option>
        </select>
      </label>
      <label class="field">Overlay width (px)
        <input id="overlay-width" type="number" min="200" max="1920" step="10" value="600">
      </label>
      <div class="row seg">
        <label class="field"><input id="events-fade" type="checkbox"> Fade out goal-change events</label>
        <label class="field">Fade after (ms)
          <input id="events-fade-ms" type="number" min="1000" step="500" value="10000">
        </label>
      </div>
      <button type="button" id="btn-save">Save settings</button>
    </div>
  </div>

  <div class="col-right">
    <div class="panel panel-preview">
      <h2>Preview</h2>
      <div id="preview-shell"><iframe id="preview" title="Goal overlay preview" hidden></iframe></div>
      <p class="note" id="preview-note">Connect your Twitch account to preview the overlay that goes into OBS.</p>
    </div>
  </div>
</div>
</body>
</html>
