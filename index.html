<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goal Overlay</title>
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/comfy.js@1.1.29/dist/comfy.min.js"></script>
<script type="module" src="./js/storage.js"></script>
<script type="module" src="./js/goal.js"></script>
<link rel="stylesheet" href="./css/overlay.css">
</head>
<body>
<div id="goal-container">
  <div class="goal-bar">
    <div class="goal-header">
      <span class="goal-label" id="goal-label">Meta Partner Plus 2</span>
      <span class="goal-progress" id="goal-progress">0 / 200</span>
    </div>
    <div class="goal-track">
      <div class="goal-fill" id="goal-fill"></div>
    </div>
    <div id="sub-events" class="sub-events"></div>
  </div>
</div>
<div id="setup-notice" hidden>
  <div class="setup-box">
    <h1>Goal Overlay setup</h1>
    <p>Add this page as a <b>Browser Source</b> in OBS.</p>
    <p>URL: <code id="obs-url"></code></p>
    <p>Replace <code>yourchannel</code> with your Twitch channel name.</p>
    <p>Generated by the dashboard: <a href="./dashboard.html" target="_blank">Open dashboard</a></p>
  </div>
</div>
</body>
</html>
